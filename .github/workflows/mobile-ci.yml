name: Mobile App CI

on:
  push:
    branches:
      - main
      - nativescript
    paths:
      - 'apps/ice-breaker/mobile/**'
      - 'package.json'
      - 'nx.json'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches:
      - main
      - nativescript
    paths:
      - 'apps/ice-breaker/mobile/**'
      - 'package.json'
      - 'nx.json'
      - '.github/workflows/mobile-ci.yml'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint mobile app
        run: npx nx lint ice-breaker-mobile

      - name: Type check
        run: npx nx run ice-breaker-mobile:build --dry-run || echo "Type checking via build dry-run"

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prepare Android build
        run: npx nx run ice-breaker-mobile:prepare --platform=android

      - name: Build Android APK
        run: npx nx run ice-breaker-mobile:build --platform=android --configuration=prod

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: apps/ice-breaker/mobile/platforms/android/app/build/outputs/apk/**/*.apk
          retention-days: 7

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Prepare iOS build
        run: npx nx run ice-breaker-mobile:prepare --platform=ios

      - name: Build iOS
        run: npx nx run ice-breaker-mobile:build --platform=ios --configuration=prod

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: apps/ice-breaker/mobile/platforms/ios/build/**/*.ipa
          retention-days: 7
